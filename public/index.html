      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10) - 1;
      const d = parseInt(parts[2], 10);
      const dt = new Date(y, m, d);
      const days = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];
      const months = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
      return `${days[dt.getDay()]} ${d}. ${months[m]}`;
    }

    function getMonthLabel(ym) {
      const [y, m] = ym.split('-');
      const months = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen', 'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];
      return `${months[parseInt(m, 10) - 1]} ${y}`;
    }

    // ========================================================
    // APLIKACE TEAMSYNC
    // ========================================================
    function App() {
      const loadState = (key, fallback) => {
        try {
          const saved = localStorage.getItem(`teamsync_v7_${key}`);

          localStorage.setItem('teamsync_v7_lineups', JSON.stringify(lineups));
          localStorage.setItem('teamsync_v7_fineRules', JSON.stringify(fineRules));
          localStorage.setItem('teamsync_v7_fines', JSON.stringify(fines));
        } catch {}
      }, [teams, currentTeamId, users, currentUserId, events, attendances, lineups, fineRules, fines]);

      const [activeTab, setActiveTab] = useState('calendar');
      const [calendarView, setCalendarView] = useState('UPCOMING');
      const [finesFilter, setFinesFilter] = useState('ALL');
      const [statsMonth, setStatsMonth] = useState('2026-11');
      const [teamMenuOpen, setTeamMenuOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      // Modály
      const [confirmDialog, setConfirmDialog] = useState(null); // { title, message, confirmLabel, onConfirm }
      const [newTeamModalOpen, setNewTeamModalOpen] = useState(false);
      const [eventModalState, setEventModalState] = useState(null); // null | { mode: 'CREATE' | 'EDIT', eventId?: string }
      const [eventDetailId, setEventDetailId] = useState(null);
      const [excuseModalEventId, setExcuseModalEventId] = useState(null);
      const [excuseReason, setExcuseReason] = useState('');
      const [cancelEventModalId, setCancelEventModalId] = useState(null);
      const [cancelEventReason, setCancelEventReason] = useState('');
      const [slotPickerSlotId, setSlotPickerSlotId] = useState(null);
      const [newFineModalOpen, setNewFineModalOpen] = useState(false);
      const [manageRulesModalOpen, setManageRulesModalOpen] = useState(false);
      const [memberModalState, setMemberModalState] = useState(null); // null | { mode: 'CREATE' | 'EDIT', userId?: string }

      const [newTeamForm, setNewTeamForm] = useState({ name: '', league: 'Okresní přebor', color: '#15803d' });
      const [eventForm, setEventForm] = useState({
        type: 'TRAINING', title: '', opponent: '', location: 'Hlavní hřiště',
        rawDate: '2026-11-30', meetTime: '17:45', startTime: '18:00', notes: ''
      });
      const [fineForm, setFineForm] = useState({ userId: '', ruleId: 'CUSTOM', title: '', amount: 50, note: '' });
      const [newRuleForm, setNewRuleForm] = useState({ title: '', amount: 100 });
      const [memberForm, setMemberForm] = useState({ name: '', nickname: '', jersey: '', pos: 'MID', role: 'PLAYER', phone: '' });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 2600);
      };

      const executeResetDemo = () => {
        localStorage.clear();
        setTeams(SEED_TEAMS);
        setCurrentTeamId('team-1');
        setUsers(SEED_USERS);
        setCurrentUserId('u-coach');
        setEvents(SEED_EVENTS);
        setAttendances(SEED_ATTENDANCES);
        setLineups(SEED_LINEUPS);
        setFineRules(SEED_FINE_RULES);
        setFines(SEED_FINES);
        setStatsMonth('2026-11');
        setTeamMenuOpen(false);
        setConfirmDialog(null);
        showToast('Výchozí data byla obnovena');
      };

      const currentTeam = teams.find(t => t.id === currentTeamId) || teams[0];
      const teamUsers = useMemo(() => users.filter(u => u.teamId === currentTeamId), [users, currentTeamId]);
      const teamPlayers = useMemo(() => teamUsers.filter(u => u.role !== 'COACH'), [teamUsers]);

      const currentUser = useMemo(() => {
        const found = teamUsers.find(u => u.id === currentUserId);
        return found || teamUsers[0] || users[0];
      }, [teamUsers, currentUserId, users]);

      const isCoach = currentUser?.role === 'COACH';
      const isCaptain = currentUser?.role === 'CAPTAIN';

      const switchRoleInCurrentTeam = (targetRole) => {
        const candidate = teamUsers.find(u => u.role === targetRole);
        if (candidate) {
          setCurrentUserId(candidate.id);
        } else {
          showToast(`V týmu zatím není žádný ${targetRole === 'COACH' ? 'Trenér' : targetRole === 'CAPTAIN' ? 'Kapitán' : 'Hráč'}`);
        }
      };

      const teamEvents = useMemo(() => {
        return events
          .filter(e => e.teamId === currentTeamId)
          .sort((a, b) => (a.rawDate || '').localeCompare(b.rawDate || ''));
      }, [events, currentTeamId]);

      const upcomingEvents = useMemo(() => teamEvents.filter(e => !e.isFinished), [teamEvents]);
      const pastEvents = useMemo(() => teamEvents.filter(e => e.isFinished).reverse(), [teamEvents]);
      const teamMatches = useMemo(() => teamEvents.filter(e => e.type === 'MATCH' && !e.isFinished && !e.isCancelled), [teamEvents]);

      const [selectedMatchId, setSelectedMatchId] = useState('ev-match-1');
      const activeMatch = useMemo(() => {
        return teamMatches.find(m => m.id === selectedMatchId) || teamMatches[0] || null;
      }, [teamMatches, selectedMatchId]);

      const activeLineup = useMemo(() => {
        if (!activeMatch) return null;
        return lineups[activeMatch.id] || {
          formation: '4-3-3',
          assignments: {},
          bench: [],
          isPublished: false,
          tacticalNotes: ''
        };
      }, [activeMatch, lineups]);

      const teamFineRules = useMemo(() => fineRules.filter(r => r.teamId === currentTeamId), [fineRules, currentTeamId]);
      const teamFines = useMemo(() => fines.filter(f => f.teamId === currentTeamId), [fines, currentTeamId]);
      const visibleFines = useMemo(() => {
        return finesFilter === 'UNPAID' ? teamFines.filter(f => !f.isPaid && !f.isCancelled) : teamFines;
      }, [teamFines, finesFilter]);

      const cashSummary = useMemo(() => {
        let collected = 0;
        let unpaid = 0;
        const debtMap = {};

        teamFines.forEach(f => {
          if (f.isCancelled) return;
          if (f.isPaid) {
            collected += f.amount;
          } else {
            unpaid += f.amount;
            if (!debtMap[f.userId]) {
              const u = teamUsers.find(x => x.id === f.userId);
              debtMap[f.userId] = {
                userId: f.userId,
                name: u ? u.name : (f.userName || 'Bývalý hráč'),
                debt: 0,
                count: 0,
              };
            }
            debtMap[f.userId].debt += f.amount;
            debtMap[f.userId].count += 1;
          }
        });

        const debtors = Object.values(debtMap).sort((a, b) => b.debt - a.debt);
        return { collected, unpaid, debtors };
      }, [teamFines, teamUsers]);

      const availableMonths = useMemo(() => {
        const set = new Set(teamEvents.filter(e => e.rawDate).map(e => e.rawDate.slice(0, 7)));
        set.add('2026-11');
        return Array.from(set).sort().reverse();
      }, [teamEvents]);

      const monthlyStats = useMemo(() => {
        const monthEvents = teamEvents.filter(e => e.isFinished && !e.isCancelled && e.rawDate?.startsWith(statsMonth));
        const total = monthEvents.length;

        const rows = teamPlayers.map(player => {
          let present = 0;
          let excused = 0;
          let unexcused = 0;

          monthEvents.forEach(ev => {
            const rec = attendances[`${ev.id}_${player.id}`];
            if (rec?.status === 'PRESENT') present++;
            else if (rec?.status === 'EXCUSED') excused++;
            else unexcused++;
          });

          const rate = total > 0 ? Math.round((present / total) * 100) : 100;
          return { player, present, excused, unexcused, total, rate };
        }).sort((a, b) => b.rate - a.rate);

        const avgRate = rows.length > 0 ? Math.round(rows.reduce((s, r) => s + r.rate, 0) / rows.length) : 100;
        return { total, rows, avgRate };
      }, [teamEvents, teamPlayers, attendances, statsMonth]);

      // HANDLERY
      const handleSwitchTeam = (teamId) => {
        setCurrentTeamId(teamId);
        const coachOfTeam = users.find(u => u.teamId === teamId && u.role === 'COACH') || users.find(u => u.teamId === teamId);
        if (coachOfTeam) setCurrentUserId(coachOfTeam.id);
        setTeamMenuOpen(false);
        showToast('Tým přepnut');
      };

      const handleCreateTeam = (e) => {
        e.preventDefault();
        if (!newTeamForm.name.trim()) return;
        const tid = `team-${Date.now()}`;
        const code = (newTeamForm.name.trim().replace(/[^a-zA-Z]/g, '').slice(0, 3).toUpperCase() || 'TYM') + '-' + Math.floor(10 + Math.random() * 89);

        const created = {
          id: tid,
          name: newTeamForm.name.trim(),
          league: newTeamForm.league.trim() || 'Amatérská soutěž',
          color: newTeamForm.color,
          shortCode: code,
        };

        const coachId = `u-${tid}-coach`;
        const captId = `u-${tid}-capt`;
        const p1Id = `u-${tid}-p1`;

        const starterUsers = [
          { id: coachId, teamId: tid, name: 'Hlavní trenér', role: 'COACH', jersey: null, pos: null, phone: '777 100 100' },
          { id: captId, teamId: tid, name: 'Kapitán týmu', role: 'CAPTAIN', jersey: 10, pos: 'MID', phone: '777 200 200' },
          { id: p1Id, teamId: tid, name: 'Brankář týmu', role: 'PLAYER', jersey: 1, pos: 'GK', phone: '777 300 300' },
        ];

        const starterRules = [
          { id: `r-${tid}-1`, teamId: tid, title: 'Pozdní příchod na sraz', amount: 50 },
          { id: `r-${tid}-2`, teamId: tid, title: 'Neomluvená absence', amount: 150 },
        ];

        setTeams([...teams, created]);
        setUsers([...users, ...starterUsers]);
        setFineRules([...fineRules, ...starterRules]);
        setCurrentTeamId(tid);
        setCurrentUserId(coachId);
        setNewTeamForm({ name: '', league: 'Okresní přebor', color: '#15803d' });
        setNewTeamModalOpen(false);
        setTeamMenuOpen(false);
        showToast(`Tým ${created.name} byl založen`);
      };

      // Otevření modálu pro vytvoření / úpravu akce
      const openCreateEventModal = (defaultType = 'TRAINING') => {
        setEventForm({
          type: defaultType, title: '', opponent: '', location: 'Hlavní hřiště',
          rawDate: '2026-11-30', meetTime: '17:45', startTime: '18:00', notes: ''
        });
        setEventModalState({ mode: 'CREATE' });
      };

      const openEditEventModal = (ev) => {
        setEventForm({
          type: ev.type,
          title: ev.title || '',
          opponent: ev.opponent || '',
          location: ev.location || '',
          rawDate: ev.rawDate || '2026-11-30',
          meetTime: ev.meetTime || '17:45',
          startTime: ev.startTime || '18:00',
          notes: ev.notes || '',
        });
        setEventDetailId(null);
        setEventModalState({ mode: 'EDIT', eventId: ev.id });
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        const isMatch = eventForm.type === 'MATCH';
        const title = isMatch
          ? `${currentTeam.name} – ${eventForm.opponent.trim() || 'Soupeř'}`
          : (eventForm.title.trim() || 'Trénink');

        if (eventModalState?.mode === 'EDIT') {
          setEvents(events.map(ev => ev.id === eventModalState.eventId ? {
            ...ev,
            type: eventForm.type,
            title,
            opponent: isMatch ? eventForm.opponent.trim() : undefined,
            location: eventForm.location.trim() || 'Hlavní hřiště',
            rawDate: eventForm.rawDate,
            meetTime: eventForm.meetTime,
            startTime: eventForm.startTime,
            notes: eventForm.notes.trim() || undefined,
          } : ev));
          showToast('Akce upravena');
        } else {
          const newEv = {
            id: `ev-${Date.now()}`,
            teamId: currentTeamId,
            type: eventForm.type,
            title,
            opponent: isMatch ? eventForm.opponent.trim() : undefined,
            location: eventForm.location.trim() || 'Hlavní hřiště',
            rawDate: eventForm.rawDate,
            meetTime: eventForm.meetTime,
            startTime: eventForm.startTime,
            notes: eventForm.notes.trim() || undefined,
            isFinished: false,
          };
          setEvents([newEv, ...events]);
          if (isMatch) setSelectedMatchId(newEv.id);
          showToast(isMatch ? 'Zápas přidán do kalendáře' : 'Trénink přidán do kalendáře');
        }
        setEventModalState(null);
      };

      const requestDeleteEvent = (ev) => {
        setConfirmDialog({
          title: 'Smazat akci?',
          message: `Opravdu chcete odstranit „${ev.title}“ z kalendáře? Smaže se i evidence docházky k této akci.`,
          confirmLabel: 'Smazat akci',
          onConfirm: () => {
            setEvents(events.filter(e => e.id !== ev.id));
            setEventDetailId(null);
            setConfirmDialog(null);
            showToast('Událost odstraněna');
          }
        });
      };

      const handleToggleEventFinished = (eventId) => {
        const target = events.find(e => e.id === eventId);
        if (target?.isCancelled) return;
        const becomingFinished = target && !target.isFinished;
        setEvents(events.map(e => e.id === eventId ? { ...e, isFinished: !e.isFinished } : e));
        if (becomingFinished && target?.rawDate) {
          const ym = target.rawDate.slice(0, 7);
          setStatsMonth(ym);
          showToast(`Uzavřeno do docházky (${getMonthLabel(ym)})`);
        } else {
          showToast('Akce znovu otevřena');
        }
      };

      const handleConfirmCancelEvent = () => {
        if (!cancelEventModalId) return;
        setEvents(events.map(e => e.id === cancelEventModalId ? {
          ...e,
          isCancelled: true,
          cancelReason: cancelEventReason.trim() || 'Zrušeno trenérem',
        } : e));
        setCancelEventModalId(null);
        setCancelEventReason('');
        setEventDetailId(null);
        showToast('Akce zrušena');
      };

      const handleRestoreEvent = (eventId) => {
        setEvents(events.map(e => e.id === eventId ? {
          ...e,
          isCancelled: false,
          cancelReason: undefined,
        } : e));
        showToast('Akce byla obnovena');
      };

      const handleSetAttendance = (eventId, userId, status, reason) => {
        const key = `${eventId}_${userId}`;
        setAttendances(prev => ({
          ...prev,
          [key]: {
            status,
            reason: status === 'EXCUSED' ? (reason?.trim() || 'Omluven bez udání důvodu') : undefined,
          }
        }));
      };

      const handleSubmitExcuse = () => {
        if (!excuseModalEventId) return;
        handleSetAttendance(excuseModalEventId, currentUser.id, 'EXCUSED', excuseReason);
        setExcuseModalEventId(null);
        setExcuseReason('');
        showToast('Omluvenka uložena');
      };

      // SESTAVA
      const updateActiveLineup = (updater) => {
        if (!activeMatch) return;
        setLineups(prev => {
          const cur = prev[activeMatch.id] || {
            formation: '4-3-3',
            assignments: {},
            bench: [],
            isPublished: false,
            tacticalNotes: ''
          };
          return { ...prev, [activeMatch.id]: updater(cur) };
        });
      };

      const handleChangeFormation = (newFormation) => {
        const oldSlots = FORMATIONS[activeLineup.formation] || [];
        const newSlots = FORMATIONS[newFormation] || [];
        const gkUserId = activeLineup.assignments['gk'] || '';
        const fieldPlayers = oldSlots
          .filter(s => !s.isGk)
          .map(s => activeLineup.assignments[s.id])
          .filter(Boolean);

        const newAssignments = {};
        if (gkUserId) newAssignments['gk'] = gkUserId;
        let idx = 0;
        newSlots.filter(s => !s.isGk).forEach(slot => {
          if (fieldPlayers[idx]) {
            newAssignments[slot.id] = fieldPlayers[idx];
            idx++;
          }
        });
        updateActiveLineup(cur => ({ ...cur, formation: newFormation, assignments: newAssignments }));
      };

      const handleAssignToSlot = (slotId, userId) => {
        updateActiveLineup(cur => {
          const updated = { ...cur.assignments };
          Object.keys(updated).forEach(k => {
            if (updated[k] === userId) updated[k] = '';
          });
          updated[slotId] = userId;
          return {
            ...cur,
            assignments: updated,
            bench: cur.bench.filter(id => id !== userId)
          };
        });
        setSlotPickerSlotId(null);
      };

      const handleClearSlot = (slotId) => {
        updateActiveLineup(cur => ({
          ...cur,
          assignments: { ...cur.assignments, [slotId]: '' }
        }));
        setSlotPickerSlotId(null);
      };

      const handleToggleBench = (userId) => {
        updateActiveLineup(cur => {
          const onBench = cur.bench.includes(userId);
          if (onBench) {
            return { ...cur, bench: cur.bench.filter(id => id !== userId) };
          }
          const updated = { ...cur.assignments };
          Object.keys(updated).forEach(k => {
            if (updated[k] === userId) updated[k] = '';
          });
          return { ...cur, assignments: updated, bench: [...cur.bench, userId] };
        });
      };

      const handleAutoFillLineup = () => {
        if (!activeMatch) return;
        const confirmed = teamPlayers.filter(p => attendances[`${activeMatch.id}_${p.id}`]?.status === 'PRESENT');
        const pool = confirmed.length > 0 ? confirmed : teamPlayers;

        if (pool.length === 0) {
          showToast('V týmu zatím nejsou hráči');
          return;
        }

        const slots = FORMATIONS[activeLineup.formation];
        const newAssignments = {};
        const gk = pool.find(p => p.pos === 'GK') || pool[0];
        const gkSlot = slots.find(s => s.isGk);
        if (gk && gkSlot) newAssignments[gkSlot.id] = gk.id;

        const rest = pool.filter(p => p.id !== gk?.id);
        let idx = 0;
        slots.filter(s => !s.isGk).forEach(s => {
          if (rest[idx]) {
            newAssignments[s.id] = rest[idx].id;
            idx++;
          }
        });

        const bench = rest.slice(idx).map(p => p.id);
        updateActiveLineup(cur => ({ ...cur, assignments: newAssignments, bench }));
        showToast(confirmed.length > 0 ? 'Sestava doplněna z potvrzených hráčů' : 'Sestava doplněna ze soupisky');
      };

      // POKUTY
      const openFineModal = () => {
        const firstPlayer = teamPlayers[0]?.id || '';
        const firstRule = teamFineRules[0];
        setFineForm({
          userId: firstPlayer,
          ruleId: firstRule ? firstRule.id : 'CUSTOM',
          title: '',
          amount: firstRule ? firstRule.amount : 50,
          note: ''
        });
        setNewFineModalOpen(true);
      };

      const handleIssueFine = (e) => {
        e.preventDefault();
        if (!fineForm.userId) return;
        const targetUser = teamUsers.find(u => u.id === fineForm.userId);
        const rule = teamFineRules.find(r => r.id === fineForm.ruleId);
        const title = fineForm.ruleId === 'CUSTOM' ? (fineForm.title.trim() || 'Vlastní pokuta') : (rule?.title || 'Pokuta');

        const newEntry = {
          id: `f-${Date.now()}`,
          teamId: currentTeamId,
          userId: fineForm.userId,
          userName: targetUser?.name || 'Hráč',
          title,
          amount: Math.max(1, Number(fineForm.amount) || 50),
          isPaid: false,
          date: 'Dnes',
          note: fineForm.note.trim() || undefined
        };
        setFines([newEntry, ...fines]);
        setNewFineModalOpen(false);
        showToast('Pokuta zapsána');
      };

      const handleToggleFinePaid = (fineId) => {
        const target = fines.find(f => f.id === fineId);
        if (!target) return;
        setFines(fines.map(f => f.id === fineId ? { ...f, isPaid: !f.isPaid } : f));
        showToast(!target.isPaid ? 'Označeno jako zaplacené' : 'Vráceno mezi nezaplacené');
      };

      const requestCancelFine = (fine) => {
        const fineUser = teamUsers.find(u => u.id === fine.userId);
        setConfirmDialog({
          title: 'Zrušit pokutu?',
          message: `Opravdu chcete zrušit (stornovat) pokutu „${fine.title}“ (${fine.amount} Kč) pro hráče ${fineUser?.name || fine.userName || 'Hráč'}?`,
          confirmLabel: 'Zrušit pokutu',
          onConfirm: () => {
            setFines(fines.map(f => f.id === fine.id ? { ...f, isCancelled: true } : f));
            setConfirmDialog(null);
            showToast('Pokuta zrušena');
          }
        });
      };

      const handleRestoreFine = (fineId) => {
        setFines(fines.map(f => f.id === fineId ? { ...f, isCancelled: false } : f));
        showToast('Pokuta obnovena');
      };

      const requestDeleteFine = (fine) => {
        const fineUser = teamUsers.find(u => u.id === fine.userId);
        setConfirmDialog({
          title: 'Trvale smazat záznam?',
          message: `Opravdu chcete trvale smazat pokutu „${fine.title}“ (${fine.amount} Kč) pro hráče ${fineUser?.name || fine.userName || 'Hráč'}?`,
          confirmLabel: 'Smazat',
          onConfirm: () => {
            setFines(fines.filter(f => f.id !== fine.id));
            setConfirmDialog(null);
            showToast('Záznam odstraněn');
          }
        });
      };

      const handleAddRule = (e) => {
        e.preventDefault();
        if (!newRuleForm.title.trim()) return;
        setFineRules([...fineRules, {
          id: `r-${Date.now()}`,
          teamId: currentTeamId,
          title: newRuleForm.title.trim(),
          amount: Math.max(1, Number(newRuleForm.amount) || 50)
        }]);
        setNewRuleForm({ title: '', amount: 100 });
        showToast('Přidáno do sazebníku');
      };

      const handleDeleteRule = (ruleId) => {
        setFineRules(fineRules.filter(r => r.id !== ruleId));

        e.preventDefault();
        if (!memberForm.name.trim()) return;

        if (memberModalState?.mode === 'EDIT') {
          const targetId = memberModalState.userId;
          setUsers(users.map(u => u.id === targetId ? {
            ...u,
            name: memberForm.name.trim(),
            nickname: memberForm.nickname.trim() || undefined,
            jersey: memberForm.jersey ? Number(memberForm.jersey) : null,
            pos: memberForm.role === 'COACH' ? null : memberForm.pos,
            role: memberForm.role,
            phone: memberForm.phone.trim() || undefined,
          } : u));
          showToast('Údaje člena upraveny');
        } else {
          const created = {
            id: `u-${Date.now()}`,
            teamId: currentTeamId,
            name: memberForm.name.trim(),
            nickname: memberForm.nickname.trim() || undefined,
            jersey: memberForm.jersey ? Number(memberForm.jersey) : null,
            pos: memberForm.role === 'COACH' ? null : memberForm.pos,
            role: memberForm.role,
            phone: memberForm.phone.trim() || undefined,

        setMemberModalState(null);

      const requestRemovePlayer = (u) => {
        if (u.id === currentUser.id) return;
        const unpaidDebt = teamFines
          .filter(f => f.userId === u.id && !f.isPaid)
          .reduce((sum, f) => sum + f.amount, 0);

        const debtWarning = unpaidDebt > 0
          ? ` Upozornění: tento hráč má v pokladně neuhrazené dluhy ve výši ${unpaidDebt} Kč.`
          : '';

        setConfirmDialog({
          title: 'Odebrat ze soupisky?',
          message: `Opravdu chcete odebrat člena ${u.name} z týmu ${currentTeam.name}?${debtWarning}`,
          confirmLabel: 'Odebrat člena',
          onConfirm: () => {
            setUsers(users.filter(x => x.id !== u.id));
            setLineups(prev => {
              const next = { ...prev };
              Object.keys(next).forEach(mid => {
                const l = next[mid];
                const cleanAssign = { ...l.assignments };
                Object.keys(cleanAssign).forEach(k => {
                  if (cleanAssign[k] === u.id) cleanAssign[k] = '';
                });
                next[mid] = {
                  ...l,
                  assignments: cleanAssign,
                  bench: (l.bench || []).filter(id => id !== u.id)
                };
              });
              return next;
            });
            setConfirmDialog(null);
            showToast(`${u.name} odebrán ze soupisky`);
          }
        });
      };

                {/* -------------------------------------------------- */}

                            const excusedCount = teamPlayers.filter(p => attendances[`${ev.id}_${p.id}`]?.status === 'EXCUSED').length;

                      className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                    />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2">
                      <label className="text-xs font-medium text-stone-600 block mb-1">Soutěž / liga</label>
                      <input
                        type="text"
                        value={newTeamForm.league}
                        onChange={(e) => setNewTeamForm({ ...newTeamForm, league: e.target.value })}
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Barva</label>
                      <input
                        type="color"
                        value={newTeamForm.color}
                        onChange={(e) => setNewTeamForm({ ...newTeamForm, color: e.target.value })}
                        className="w-full h-9 bg-stone-50 border border-stone-200 rounded-xl p-1 cursor-pointer"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button type="button" onClick={() => setNewTeamModalOpen(false)} className="py-2.5 rounded-xl bg-stone-100 text-stone-700 font-medium text-xs">Zrušit</button>
                    <button type="submit" className="py-2.5 rounded-xl bg-green-700 hover:bg-green-800 text-white font-medium text-xs">Založit tým</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {newFineModalOpen && (
            <div className="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-4">
              <div className="bg-white border border-stone-200 rounded-2xl p-5 w-full max-w-md shadow-xl space-y-4 max-h-[90vh] overflow-y-auto animate-fade-up">
                <div className="flex items-center justify-between">
                  <h3 className="font-semibold text-base text-stone-900">Udělit pokutu</h3>
                  <button onClick={() => setNewFineModalOpen(false)} className="text-stone-400 hover:text-stone-700">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {teamPlayers.length === 0 ? (
                  <p className="text-xs text-stone-500 py-4 text-center">V týmu zatím nejsou žádní hráči.</p>
                ) : (
                  <form onSubmit={handleIssueFine} className="space-y-3">
                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Hráč</label>
                      <select
                        value={fineForm.userId}
                        onChange={(e) => setFineForm({ ...fineForm, userId: e.target.value })}
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                      >
                        {teamPlayers.map(p => (
                          <option key={p.id} value={p.id}>{p.name} {p.jersey ? `#${p.jersey}` : ''}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Typ pokuty</label>
                      <select
                        value={fineForm.ruleId}
                        onChange={(e) => {
                          const r = teamFineRules.find(x => x.id === e.target.value);
                          setFineForm({
                            ...fineForm,
                            ruleId: e.target.value,
                            amount: r ? r.amount : fineForm.amount
                          });
                        }}
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                      >
                        {teamFineRules.map(r => (
                          <option key={r.id} value={r.id}>{r.title} ({r.amount} Kč)</option>
                        ))}
                        <option value="CUSTOM">Vlastní důvod...</option>
                      </select>
                    </div>

                    {fineForm.ruleId === 'CUSTOM' && (
                      <div>
                        <label className="text-xs font-medium text-stone-600 block mb-1">Vlastní důvod</label>
                        <input
                          type="text" required
                          value={fineForm.title}
                          onChange={(e) => setFineForm({ ...fineForm, title: e.target.value })}
                          placeholder="Např. Rozbitý míč"
                          className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                        />
                      </div>
                    )}

                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Částka (Kč)</label>
                      <input
                        type="number" required min="1"
                        value={fineForm.amount}
                        onChange={(e) => setFineForm({ ...fineForm, amount: e.target.value })}
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Poznámka</label>
                      <input
                        type="text"
                        value={fineForm.note}
                        onChange={(e) => setFineForm({ ...fineForm, note: e.target.value })}
                        placeholder="Volitelný popis..."
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <button type="button" onClick={() => setNewFineModalOpen(false)} className="py-2.5 rounded-xl bg-stone-100 text-stone-700 font-medium text-xs">Zrušit</button>
                      <button type="submit" className="py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-medium text-xs">Zapsat</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {manageRulesModalOpen && (
            <div className="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-4">
              <div className="bg-white border border-stone-200 rounded-2xl p-5 w-full max-w-md shadow-xl space-y-4 max-h-[85vh] overflow-y-auto animate-fade-up">
                <div className="flex items-center justify-between">
                  <h3 className="font-semibold text-base text-stone-900">Sazebník pokut</h3>
                  <button onClick={() => setManageRulesModalOpen(false)} className="text-stone-400 hover:text-stone-700">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleAddRule} className="p-3 bg-stone-50 rounded-xl border border-stone-200 space-y-2">
                  <input
                    type="text" required
                    value={newRuleForm.title}
                    onChange={(e) => setNewRuleForm({ ...newRuleForm, title: e.target.value })}
                    placeholder="Nová položka sazebníku..."
                    className="w-full bg-white border border-stone-200 rounded-lg p-2 text-xs text-stone-900"
                  />
                  <div className="flex gap-2">
                    <input
                      type="number" required min="1"
                      value={newRuleForm.amount}
                      onChange={(e) => setNewRuleForm({ ...newRuleForm, amount: e.target.value })}
                      className="w-1/2 bg-white border border-stone-200 rounded-lg p-2 text-xs text-stone-900"
                    />
                    <button type="submit" className="w-1/2 py-2 bg-stone-900 hover:bg-stone-800 text-white font-medium rounded-lg text-xs">
                      Přidat
                    </button>
                  </div>
                </form>

                <div className="divide-y divide-stone-100 text-[13px]">
                  {teamFineRules.map(r => (
                    <div key={r.id} className="py-2.5 flex items-center justify-between gap-2">
                      <span className="text-stone-700">{r.title}</span>
                      <div className="flex items-center gap-2 shrink-0">
                        <span className="font-semibold text-stone-900 tabular-nums">{r.amount} Kč</span>
                        <button onClick={() => handleDeleteRule(r.id)} className="text-stone-400 hover:text-rose-600">
                          <Icon name="trash" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODÁL: PŘIDAT / UPRAVIT ČLENA TÝMU */}
          {memberModalState && (
            <div className="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-4">
              <div className="bg-white border border-stone-200 rounded-2xl p-5 w-full max-w-md shadow-xl space-y-4 animate-fade-up">
                <div className="flex items-center justify-between">
                  <h3 className="font-semibold text-base text-stone-900">
                    {memberModalState.mode === 'EDIT' ? 'Upravit člena týmu' : 'Přidat člena týmu'}
                  </h3>
                  <button onClick={() => setMemberModalState(null)} className="text-stone-400 hover:text-stone-700">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveMember} className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-stone-600 block mb-1">Jméno a příjmení</label>
                    <input
                      type="text" required
                      value={memberForm.name}
                      onChange={(e) => setMemberForm({ ...memberForm, name: e.target.value })}
                      placeholder="Jan Novák"
                      className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Přezdívka</label>
                      <input
                        type="text"
                        value={memberForm.nickname}
                        onChange={(e) => setMemberForm({ ...memberForm, nickname: e.target.value })}
                        placeholder="Volitelné"
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Číslo dresu</label>
                      <input
                        type="number"
                        value={memberForm.jersey}
                        onChange={(e) => setMemberForm({ ...memberForm, jersey: e.target.value })}
                        placeholder="Např. 10"
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Role v týmu</label>
                      <select
                        value={memberForm.role}
                        onChange={(e) => setMemberForm({ ...memberForm, role: e.target.value })}
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                      >
                        <option value="PLAYER">Hráč</option>
                        <option value="CAPTAIN">Kapitán</option>
                        <option value="COACH">Trenér</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-medium text-stone-600 block mb-1">Pozice</label>
                      <select
                        disabled={memberForm.role === 'COACH'}
                        value={memberForm.pos}
                        onChange={(e) => setMemberForm({ ...memberForm, pos: e.target.value })}
                        className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900 disabled:opacity-50"
                      >
                        <option value="GK">Brankář (GK)</option>
                        <option value="DEF">Obránce (DEF)</option>
                        <option value="MID">Záložník (MID)</option>
                        <option value="FWD">Útočník (FWD)</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-medium text-stone-600 block mb-1">Telefon</label>
                    <input
                      type="tel"
                      value={memberForm.phone}
                      onChange={(e) => setMemberForm({ ...memberForm, phone: e.target.value })}
                      placeholder="777 123 456"
                      className="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-xs text-stone-900"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button type="button" onClick={() => setMemberModalState(null)} className="py-2.5 rounded-xl bg-stone-100 text-stone-700 font-medium text-xs">Zrušit</button>
                    <button type="submit" className="py-2.5 rounded-xl bg-green-700 hover:bg-green-800 text-white font-medium text-xs">
                      {memberModalState.mode === 'EDIT' ? 'Uložit změny' : 'Přidat'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
